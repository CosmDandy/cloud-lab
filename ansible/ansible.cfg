[defaults]
roles_path = roles
inventory = inventory/local.yml

# Расшифровка секретов на лету: файлы вида host_vars/<host>/secrets.sops.yaml
# и group_vars/<group>/secrets.sops.yaml подхватываются как обычные
# переменные. host_group_vars перечислен явно — при указании vars_plugins_enabled
# список замещается целиком, и без него перестанут читаться обычные
# host_vars/group_vars.
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
# Убирает отдельный SSH-раунд на каждую задачу: на канале до Хельсинки
# это разница в минуты на прогон.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey
