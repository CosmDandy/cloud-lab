---
wallcal_dir: /opt/wallcal
wallcal_owner: root

# Версия закреплена: edge и latest в ghcr идут за master, и с ними прогон
# роли в произвольный день притащил бы другой рендер обоев. Тег 0.1.0
# указывает на тот же образ, что и sha-47d455bc1cc… (сверено по digest
# sha256:717cceccafe5…), и предпочтён ему как читаемый.
wallcal_image: ghcr.io/cosmdandy/wallcal:0.1.0

# Домен, на котором отвечает сервис; задаётся в инвентаре. Запрос с любым
# другим Host сервис отбивает 400-м, и это не лишняя строгость: ссылка на
# обои живёт в Shortcut на телефоне, а домен по умолчанию (*) означал бы,
# что сервис отвечает и на чужое имя, наведённое на этот адрес.
wallcal_domain: ""
wallcal_edge_network: "{{ edge_network | default('edge') }}"
wallcal_port: 8000

# Пояс, решающий, какой день считать сегодняшним: от него зависит
# подсвеченная точка и footer с прогрессом. Любая ссылка переопределяет
# его через ?tz=. Внутри контейнер живёт по UTC — TZ сервис не читает
# намеренно, чтобы картинка не зависела от часов хоста.
wallcal_tz: Europe/Moscow

# Чьему X-Forwarded-For верить. Без этого в каждой строке лога стоит адрес
# traefik, а не телефона. "*" держится на том, что контейнер не публикует
# портов: снаружи хоста до него не дотянуться. Подделать заголовок может
# сосед по сети edge — она общая на все стеки хоста, в ней полтора десятка
# контейнеров, — и это принято сознательно: цена вопроса здесь строка в
# логе доступа к публичным картинкам. Появятся ports: — "*" станет дырой
# для всего интернета, и сюда пойдёт CIDR сети edge.
wallcal_trusted_proxy: "*"

# Лимиты на публичный эндпоинт. Сервис не требует аутентификации, а каждый
# запрос стоит ~140 мс процессора, и запись wallcal не проксируется —
# поглощать флуд некому. Считает traefik, по адресу источника.
#
# 2 запроса в секунду — это уже около трети ядра на одного клиента;
# телефону нужен один запрос в сутки, а burst существует ради страницы
# конструктора: живое превью шлёт серию запросов, пока крутят ползунки.
wallcal_rate_average: 2
wallcal_rate_burst: 20

# Одновременных запросов с одного адреса. Частоту ограничивает лимит выше,
# но не параллельность: двадцать одновременных рендеров — это те же два
# ядра. У самого сервиса семафор на 2 рендера и очередь на 8, traefik
# отсекает раньше и дешевле — до сокета приложения.
wallcal_inflight: 4

# Потолок процессора: одно ядро из двух. Даже полностью занятый рендером
# контейнер оставляет ядро traefik, headscale, панели и остальным.
wallcal_cpus: "1.0"

# 153 МБ — измеренный пик под сорока одновременными запросами, 256 МБ
# оставляют запас. Лимит нужен не сервису, а хосту: без него выбор жертвы
# при нехватке памяти делает OOM-killer, и это может быть не wallcal.
wallcal_mem_limit: 256m
