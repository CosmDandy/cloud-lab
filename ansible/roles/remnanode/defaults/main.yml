---
remnanode_dir: /opt/remnanode
remnanode_owner: root

# Тег закреплён намеренно. latest разрешается в digest один раз — в момент
# pull, — и дальше контейнер держит именно его: на проде метка latest
# простояла с 15.07 по 14.08 на образе, собранном до выхода node 3.0.0.
remnanode_image: remnawave/node:3.2.0

# Порт агента, которым панель управляет нодой. Наружу не выставлен.
remnanode_port: 2222

# Выдаётся панелью при создании ноды, лежит в SOPS.
remnanode_secret_key: ""

# Сертификат для hysteria-инбаундов: Xray читает его по этому пути изнутри
# контейнера. Без монтирования файл существует только внутри и пропадает
# при каждом пересоздании — а вместе с ним не стартует весь Xray, включая
# боевые Reality-инбаунды.
remnanode_tls_dir: /etc/hysteria

# Xray держит файловый дескриптор на соединение.
remnanode_nofile: 1048576

# Port hopping для инбаунда HY2-Hop: клиент рассылает пакеты по всему
# диапазону, меняя порт каждые несколько секунд, а nftables заворачивает
# их на единственный, который слушает Xray. Смысл в том, что фильтру не за
# что зацепиться — нет постоянной пары адрес:порт.
#
# Диапазон и цель обязаны совпадать с udpHop и port в инбаунде панели.
# Эту связь ничто не проверяет: разъедутся — клиент будет слать в пустоту.
remnanode_porthop_range: "47000-47100"
remnanode_porthop_target: 47824
remnanode_porthop_rules: /etc/nftables.d/hyhop.nft
