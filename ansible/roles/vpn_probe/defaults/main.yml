---
# Проба протоколов из России: каждый хост подписки глазами пользователя,
# раз в несколько минут, результат — в VictoriaMetrics. Gatus проверяет ноды
# из Швеции и остаётся зелёным, когда путь из России режет протокол: 17-18.10
# AMS Vision не принял ни одного соединения при полностью зелёном gatus.
vpn_probe_dir: /opt/vpn-probe

# Та же подписка, что у живого пользователя: расхождение между конфигом
# сервера и тем, что раздаёт панель, — тоже поломка, и проба её видит.
# Секрет, задаётся в SOPS хоста.
vpn_probe_subscription_url: ""

# Administrative state is separate from connectivity: an offline enabled
# node must still fail the probe. The token needs read access to /api/nodes.
vpn_probe_panel_api_url: https://vpn.cosmdandy.dev/api
vpn_probe_panel_api_token: ""

# Приём текстового формата Prometheus — на том же домене и под той же
# basic-auth, что remote write нод.
vpn_probe_push_url: https://vm.cosmdandy.dev/api/v1/import/prometheus
vpn_probe_push_user: metrics-push
vpn_probe_push_password: ""
vpn_probe_instance: "{{ inventory_hostname }}"

# Клиент не старее сервера: с 26.7 REALITY по умолчанию требует
# minClientVer 26.3.27, а клиент без ML-DSA не проверит подпись так, как
# это делает живое приложение.
vpn_probe_xray_version: "26.7.28"
# Release asset suffix per CPU: the home probe is a Pi Zero (armv6l).
vpn_probe_xray_arch: >-
  {{ {'x86_64': '64', 'aarch64': 'arm64-v8a', 'armv7l': 'arm32-v7a',
      'armv6l': 'arm32-v6'}[ansible_facts['architecture']] }}
vpn_probe_xray_url: >-
  https://github.com/XTLS/Xray-core/releases/download/v{{ vpn_probe_xray_version }}/Xray-linux-{{ vpn_probe_xray_arch }}.zip

# Последовательный прогон при недоступности всего подряд занимал бы десятки
# минут: три попытки по 8 секунд на хост, четыре хоста разом.
vpn_probe_tries: 3
vpn_probe_workers: 4
# Every 10 minutes at :05, :15, ...: a 10-minute dashboard bucket holds
# exactly one run. The office path has minute-long windows when the ISP
# cuts TLS to our addresses; alerts still need two hours of failures, so
# those windows show on the dashboard and do not page. A run takes ~30 s
# in the office and ~3.5 min on the Pi; if one overruns, systemd skips
# the next trigger instead of stacking runs.
vpn_probe_schedule: "*-*-* *:05/10:00"
# Past the ~16 KB after which the Russian filter freezes a connection
# instead of cutting it: a 204 passes under that, real traffic stalls.
vpn_probe_transfer_bytes: 262144
# One request through the tunnel, and how long xray may take to start
# listening. Raised per host on slow boards, see host_vars/rpi-local-l-01.
vpn_probe_fetch_timeout: 8
vpn_probe_start_timeout: 5
