---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - panel_domain | length > 0
      - panel_sub_domain | length > 0
      - panel_postgres_password | length > 0
      - panel_app_secret | length > 0
    fail_msg: >-
      Нужны panel_domain, panel_sub_domain и два секрета: пароль postgres
      и panel_app_secret. Смена panel_app_secret разлогинивает всех и
      обнуляет выданные API-токены — одной солью подписаны и те, и другие.

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ panel_dir }}/{{ item }}"
    state: directory
    owner: "{{ panel_owner }}"
    group: "{{ panel_owner }}"
    mode: "0750"
  loop:
    - ""
    - panel
    - subscription

- name: Render panel environment file
  ansible.builtin.template:
    src: panel-env.j2
    dest: "{{ panel_dir }}/panel/.env"
    owner: "{{ panel_owner }}"
    group: "{{ panel_owner }}"
    mode: "0600"
  no_log: true
  register: panel_env_file

- name: Render subscription environment file
  ansible.builtin.template:
    src: subscription-env.j2
    dest: "{{ panel_dir }}/subscription/.env"
    owner: "{{ panel_owner }}"
    group: "{{ panel_owner }}"
    mode: "0600"
  no_log: true
  register: panel_subscription_env_file

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ panel_dir }}/docker-compose.yaml"
    owner: "{{ panel_owner }}"
    group: "{{ panel_owner }}"
    mode: "0640"

# Один шаг вместо deploy + handler-рестарта. Раньше handler со
# state: restarted срабатывал в конце плея и перезапускал весь стек вместе с
# postgres — 19.10.2026 это случилось посреди миграций нового бэкенда, prisma
# оставила миграцию в статусе failed, и панель ушла в цикл рестартов (P3009).
# Изменения compose-файла compose пересоздаёт сам; правку env-файлов он не
# видит, поэтому для неё — recreate: always.
- name: Deploy stack
  community.docker.docker_compose_v2:
    project_src: "{{ panel_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: >-
      {{ 'always' if panel_env_file is changed
         or panel_subscription_env_file is changed else 'auto' }}

# Токен выпускается в UI и в конфигурации не хранится: без него страница
# подписок поднимется, но не покажет ни одной подписки.
- name: Warn about missing subscription API token
  ansible.builtin.debug:
    msg: >-
      panel_subscription_api_token пуст — выпустите токен в UI панели,
      положите в SOPS и прогоните роль повторно.
  when: panel_subscription_api_token | length == 0
