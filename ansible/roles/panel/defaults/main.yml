---
panel_dir: /opt/panel
panel_owner: root

# Версии закреплены, включая subscription-page: на проде он ехал с latest
# и обновлялся при каждом pull незаметно для деплоя.
panel_backend_image: remnawave/backend:2.8.1
panel_subscription_image: remnawave/subscription-page:7.2.6
panel_postgres_image: postgres:17-alpine
panel_redis_image: redis:7-alpine

panel_domain: ""
panel_sub_domain: ""

panel_edge_network: "{{ edge_network | default('edge') }}"

panel_postgres_db: remnawave
panel_postgres_user: remnawave
panel_postgres_password: ""

panel_jwt_auth_secret: ""
panel_jwt_api_tokens_secret: ""

# /metrics закрыт basic auth — из-под него скрейпит роль observability.
panel_metrics_user: metrics
panel_metrics_password: ""

# Выпускается вручную в UI панели после первого входа и кладётся в SOPS.
# Панель не умеет отдавать его из конфигурации: страница подписок без
# токена поднимется, но останется пустой.
panel_subscription_api_token: ""

# Прод редиректит корень домена подписок на контакт поддержки.
# Пусто — редиректа нет.
panel_sub_root_redirect: ""

panel_api_instances: 1
panel_docs_enabled: false
panel_telegram_notifications_enabled: false
panel_webhook_enabled: false
