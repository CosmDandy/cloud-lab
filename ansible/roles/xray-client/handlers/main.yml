---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart xray
  ansible.builtin.systemd_service:
    name: xray
    state: restarted

# Настройки proxies в daemon.json читаются только при старте демона.
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
