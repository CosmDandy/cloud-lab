---
atuin_dir: /opt/atuin
atuin_owner: root

# Версия закреплена: плавающий latest ломает воспроизводимость, а у atuin
# это ещё и риск рассинхрона с клиентами — в 18.18.0 удалён протокол
# синхронизации V1, и клиенты старше него с этим сервером не заговорят.
# Тег БЕЗ префикса v, хотя релиз на GitHub называется v18.19.0: в ghcr
# образы лежат как 18.19.0, а v18.19.0 отдаёт 404 (проверено). Остальные
# теги там — хеши коммитов.
atuin_image: ghcr.io/atuinsh/atuin:18.19.0

# Домен, на котором отвечает сервер; задаётся в инвентаре.
atuin_domain: ""
atuin_edge_network: "{{ edge_network | default('edge') }}"
atuin_port: 8888

# Регистрация закрыта по умолчанию — так же, как в самом atuin.
# Порядок заведения аккаунта: включить, зарегистрироваться клиентом
# (atuin register), выключить обратно и прогнать роль ещё раз.
# SSO здесь не будет: OIDC для self-hosted закрыт как not planned
# (atuinsh/atuin#3836, 02.08.2026), а oauth2-proxy не поставить — синхронизация
# идёт из CLI, интерактивный вход ей недоступен.
atuin_open_registration: false

# SQLite вместо постгреса: сервер его поддерживает, а на одного пользователя
# отдельная СУБД — лишний контейнер и лишний бэкап. Официальный
# docker-compose из документации показывает postgres, поэтому если SQLite
# однажды подведёт, переключение — это ровно одна строка:
#   atuin_db_uri: "postgres://user:pass@db/atuin"
# плюс сервис postgres в шаблоне compose.
atuin_db_uri: "sqlite:///config/atuin.db"

atuin_log_level: "info,atuin_server=info"
