---
# Машина живёт на 8 GB без подкачки: пиковая аллокация одного сервиса
# упирается в OOM-killer, который убивает процесс целиком вместо того,
# чтобы дать системе притормозить. Swap здесь — страховка от этого, а не
# рабочая память; отсюда низкий swappiness ниже.
#
# fallocate на ext4 выделяет непрерывные экстенты, а не разрежённый файл, и
# mkswap проходит. На btrfs и xfs так нельзя — там файл получается с дырами,
# и ядро откажется его подключать; тем FS нужен dd.
- name: Create swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ base_swap_file_size }} {{ base_swap_file }}
    creates: "{{ base_swap_file }}"

# Условие ниже смотрит на сигнатуру в самом файле, а не на «предыдущая
# задача отработала»: прогон, оборванный между fallocate и mkswap, оставляет
# файл на месте, и по creates он больше никогда бы не отформатировался.
- name: Read swap file signature
  ansible.builtin.command:
    cmd: blkid -p -s TYPE -o value {{ base_swap_file }}
  register: base_swap_signature
  changed_when: false
  # Файла ещё нет или он пуст — blkid выходит с ненулевым кодом, и это
  # ровно тот случай, ради которого дальше вызывается mkswap.
  failed_when: false
  check_mode: false

# chmod здесь, а не отдельным file-модулем: mkswap отказывается работать с
# файлом, доступным не только root, а fallocate создаёт его по umask. Тем же
# заходом задача остаётся проходимой в --check, где файла ещё не существует
# и модуль file упал бы на отсутствующем пути.
- name: Format swap file
  ansible.builtin.shell:
    cmd: chmod 600 {{ base_swap_file }} && mkswap {{ base_swap_file }}
  when: base_swap_signature.stdout | trim != "swap"
  changed_when: true

- name: Persist swap file in fstab
  ansible.posix.mount:
    path: none
    src: "{{ base_swap_file }}"
    fstype: swap
    opts: sw
    state: present

- name: Read active swap devices
  ansible.builtin.command:
    cmd: cat /proc/swaps
  register: base_swap_active
  changed_when: false
  # Иначе в --check задача пропускается, register остаётся пустым, и
  # следующая падает на обращении к .stdout.
  check_mode: false

# Запись в fstab действует только со следующей загрузки, а машина живёт
# аптаймами в месяцы.
- name: Activate swap file
  ansible.builtin.command:
    cmd: swapon {{ base_swap_file }}
  when: base_swap_file not in base_swap_active.stdout
  changed_when: true

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ base_swappiness | string }}"
    sysctl_file: "{{ base_swap_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
