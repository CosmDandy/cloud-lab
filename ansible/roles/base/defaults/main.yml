---
base_packages:
  - ca-certificates
  - curl
  - gettext-base
  - jq
  - rsync
  - unattended-upgrades

# Пользователь, от которого работает деплой и GitHub-раннер.
base_deploy_user: github-runner

# sudo выдаётся только на команды, нужные деплою, а не целиком.
base_deploy_user_sudo: >-
  ALL=(ALL) NOPASSWD: /usr/bin/apt-get, /usr/bin/mkdir, /usr/bin/chown,
  /usr/bin/rsync, /usr/sbin/ufw, /usr/bin/docker

# Каталоги под стеки; владельцем становится base_deploy_user.
base_stack_dirs: []

base_sshd_hardening:
  PermitRootLogin: prohibit-password
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  X11Forwarding: "no"
  MaxAuthTries: "3"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "2"

# Swap-файл. Роль стоит на control-plane с 8 GB памяти и без подкачки:
# ядру некуда вытеснить холодные страницы, и любой пик упирается сразу в
# OOM-killer. Размер переопределяется в host_vars, если машина другая.
base_swap_file: /swapfile
base_swap_file_size: 4G

# Swap здесь — аварийный запас, а не расширение памяти: 10 означает, что
# ядро уходит на диск только под реальным давлением, а не ради кэша.
base_swappiness: 10
base_swap_sysctl_file: /etc/sysctl.d/99-swap.conf
