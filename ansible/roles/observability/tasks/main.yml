---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - observability_domain | length > 0
      - observability_grafana_admin_password | length > 0
    fail_msg: Нужны observability_domain и observability_grafana_admin_password.

- name: Validate peer-users settings
  ansible.builtin.assert:
    that:
      - observability_panel_api_token | length > 0
      - observability_panel_api_url is match('https://[^/]+/api$')
    fail_msg: peer-users needs observability_panel_api_token and observability_panel_api_url.
  when: observability_peer_users_enabled

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ observability_dir }}/{{ item }}"
    state: directory
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0750"
  loop:
    - ""
    - grafana
    - loki
    - promtail
    - vmalert
    - peer-users

# 0644, а не 0640: loki и grafana работают не от root и свои конфиги
# при более строгих правах просто не открывают.
- name: Install static configs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ observability_dir }}/{{ item }}"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0644"
  loop:
    - grafana/datasources.yaml
    - grafana/dashboards.yaml
    - promtail/config.yaml
    - vmalert/alerts.yaml
    - peer-users/peer_users.py
  notify: Restart observability stack

# Каталогом, а не через loop: дашборды добавляются и удаляются, и держать
# их список в двух местах — гарантированное расхождение. Слеш в конце src
# означает «содержимое каталога», без него создался бы вложенный dashboards/.
- name: Install grafana dashboards
  ansible.builtin.copy:
    src: grafana/dashboards/
    dest: "{{ observability_dir }}/grafana/dashboards/"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0644"
  notify: Restart observability stack

# 0644 по той же причине, что и статические конфиги: loki работает не от root.
- name: Render loki config
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: "{{ observability_dir }}/loki/config.yaml"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0644"
  notify: Restart observability stack

# no_log: в конфиге лежит токен бота. Владелец — uid процесса в контейнере
# (alertmanager работает от nobody), потому что 0644 сделал бы токен читаемым
# любому пользователю хоста, а от 0640 root-овского файла контейнер получает
# permission denied.
- name: Render alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ observability_dir }}/alertmanager.yml"
    owner: "{{ observability_alertmanager_uid }}"
    group: "{{ observability_alertmanager_uid }}"
    mode: "0640"
  no_log: true
  when: observability_alerting_enabled
  notify: Restart observability stack

- name: Render scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_dir }}/prometheus.yml"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0640"
  no_log: "{{ observability_panel_metrics_enabled }}"
  notify: Restart observability stack

- name: Render grafana environment file
  ansible.builtin.template:
    src: grafana-env.j2
    dest: "{{ observability_dir }}/grafana/.env"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0600"
  no_log: true
  notify: Restart observability stack

# 0600 and no_log: the file carries the panel API token.
- name: Render peer-users environment file
  ansible.builtin.template:
    src: peer-users-env.j2
    dest: "{{ observability_dir }}/peer-users/.env"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0600"
  no_log: true
  when: observability_peer_users_enabled
  notify: Restart observability stack

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ observability_dir }}/docker-compose.yaml"
    owner: "{{ observability_owner }}"
    group: "{{ observability_owner }}"
    mode: "0640"
  notify: Restart observability stack

- name: Deploy stack
  community.docker.docker_compose_v2:
    project_src: "{{ observability_dir }}"
    state: present
    pull: missing
    remove_orphans: true
