groups:
  - name: host
    interval: 30s
    rules:
      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: DiskSpace
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Root filesystem usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

  - name: containers
    interval: 30s
    rules:
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~".+"}) or (time() - container_last_seen{name=~".+"}) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has not been seen for more than 60 seconds"

  # Сеть VPN-нод. Симптом пользователя — «обрывы и зависания» — виден только
  # здесь: xray в лог ничего не пишет, панель логирует лишь свои cron-задачи,
  # а gatus проверяет доступность порта, которая при этих потерях не падает.
  - name: vpn-network
    interval: 30s
    rules:
      - alert: UdpReceiveBufferErrors
        # Переполнение приёмного буфера UDP-сокета: теряются QUIC и DNS, то
        # есть видео и звонки. Порог в 100 за 5 минут отсекает единичные
        # всплески — в спокойные часы на нодах ровно ноль.
        expr: increase(node_netstat_Udp_RcvbufErrors[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UDP receive buffer overflow on {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} datagrams dropped in 5m — QUIC and DNS suffer first"

      # Пороги подобраны по факту за 7 дней, а не на глаз. Медиана доли
      # ретрансмитов на нодах — 0.3-0.6 %, p90 — 1-5 %, p99 — 9-12 %,
      # максимум — 35 %: у прокси на другом конце клиенты с мобильным
      # интернетом и длинные маршруты, ретрансмиты там штатны.
      #
      # Первая версия (> 5 % за 15 минут) держалась бы выше порога 3-10 %
      # времени, то есть орала бы по нескольку раз в день. Окно в час
      # сглаживает всплески, порог в 10 % отсекает шум, а условие на объём
      # обязательно: TCP-трафик ноды — медианные 10-15 сегментов в секунду,
      # и на пустой ноде десяток ретрансмитов даёт «20 %» на ровном месте.
      # С этими значениями за те же 7 дней вышел ровно один эпизод на ноду.
      - alert: HighTcpRetransmitRatio
        expr: >-
          (100 * rate(node_netstat_Tcp_RetransSegs[1h])
           / rate(node_netstat_Tcp_OutSegs[1h]) > 10)
          and (rate(node_netstat_Tcp_OutSegs[1h]) > 50)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TCP retransmit ratio above 10% on {{ $labels.instance }}"
          description: "Current: {{ $value | printf \"%.1f\" }}% of outgoing segments retransmitted"

      - alert: ConntrackNearLimit
        expr: >-
          node_nf_conntrack_entries
          / node_nf_conntrack_entries_limit > 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Conntrack table {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
          description: "New connections are dropped silently once the table fills"

  # Правила про качество связи конкретного клиента. Ряды приходят из
  # tcp-quality.timer на нодах (roles/node_metrics): ядро считает потери и RTT
  # по каждому сокету, здесь они превращаются в повод разбудить человека.
  #
  # Почему это отдельно от HighTcpRetransmitRatio: тот считает долю по ноде за
  # час и на инциденте 12.09 сработал через 45 минут после начала, когда всё
  # уже кончилось. Клиентские ряды короче усредняют и называют пострадавшего.
  - name: vpn-clients
    interval: 30s
    rules:
      # 5 % по байтам — уже заметная деградация: TCP на таких потерях режет
      # окно вдвое каждые несколько секунд и скорость падает кратно. Десять
      # минут выдержки отсекают короткие всплески на переподключении.
      - alert: ClientHighRetransmit
        expr: vpn_client_tcp_retrans_ratio > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.peer }} losing {{ $value | printf \"%.1f\" }}% on {{ $labels.inbound }}"
          description: >-
            Retransmitted bytes over total sent, measured per socket on
            {{ $labels.instance }}. Check whether the same client is healthy on
            another inbound before blaming the node.

      # RTT втрое выше минимального по тому же пути — очередь где-то на пути
      # заполнена. Это видно раньше потерь: сначала растёт задержка, потом
      # буфер переполняется и начинается отброс.
      - alert: ClientRttInflated
        expr: vpn_client_tcp_rtt_inflation > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.peer }} RTT {{ $value | printf \"%.1f\" }}x above path minimum"
          description: "Queue building up on the path to {{ $labels.peer }} via {{ $labels.inbound }}"

      # Отдельный случай: потери ложные. Пакеты идут разными путями, приходят
      # не по порядку, TCP считает их потерянными и шлёт заново — DSACK потом
      # сообщает, что это было зря. Транспорт менять бессмысленно, лечится
      # настройками TCP, поэтому и алерт отдельный.
      - alert: ClientReorderingHigh
        expr: vpn_client_tcp_reordering > 100 and vpn_client_tcp_spurious_ratio > 0.05
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Packet reordering on the path to {{ $labels.peer }}"
          description: >-
            Kernel reordering estimate {{ $value }} with over 5% of retransmits
            reported spurious — multipath artefact rather than a lossy link.

      # Клиент не может даже установить соединение: SYN уходит повторно.
      # Счётчик уже собирался node-exporter'ом, но правила на него не было, и
      # жалоба «не подключается» ничем не подтверждалась.
      - alert: SynRetransmitSpike
        expr: >-
          rate(node_netstat_TcpExt_TCPSynRetrans[5m]) > 2
          and rate(node_netstat_TcpExt_TCPSynRetrans[5m])
              / rate(node_netstat_Tcp_OutSegs[5m]) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SYN retransmits on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}/s"
          description: "Clients are failing to establish connections, not just losing data mid-stream"

      # Короткое окно к часовому правилу: ловит то, что усреднение съедает.
      # Порог выше (15 %), чтобы пятиминутка на пустом канале не будила зря.
      - alert: TcpRetransmitBurst
        expr: >-
          (100 * rate(node_netstat_Tcp_RetransSegs[5m])
           / rate(node_netstat_Tcp_OutSegs[5m]) > 15)
          and (rate(node_netstat_Tcp_OutSegs[5m]) > 200)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TCP retransmit burst on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}%"
          description: "Short-window spike; the hourly rule will only catch this 30+ minutes later"

  - name: scraping
    interval: 30s
    rules:
      # Молчащий источник данных выглядит как «всё спокойно». Панель отдавала
      # 401 на /metrics и не собиралась вовсе — заметить это было нечем.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "No metrics collected for 10 minutes — check credentials and reachability"
