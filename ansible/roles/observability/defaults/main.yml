---
observability_dir: /opt/observability
observability_owner: root

observability_vm_image: victoriametrics/victoria-metrics:v1.148.0
observability_vmalert_image: victoriametrics/vmalert:v1.148.0
observability_alertmanager_image: prom/alertmanager:v0.28.1
# uid, под которым процесс работает внутри контейнера.
observability_alertmanager_uid: "65534"
observability_grafana_image: grafana/grafana:13.1.1
# loki и promtail держим одной парой версий: push API стабилен,
# но конфиг-схемы между минорами разъезжаются.
# 3.5 сыпала 'negative structured metadata bytes received' по полсотни
# строк в минуту — ошибка учёта, логи при этом доходили.
observability_loki_image: grafana/loki:3.6.15
# promtail заморожен на 3.6.11: grafana перевела сбор логов на alloy и
# новых сборок не выпускает. Держим loki в той же минорной ветке.
observability_promtail_image: grafana/promtail:3.6.11
observability_node_exporter_image: prom/node-exporter:v1.12.1
# Адрес docker0: на него резолвится host.docker.internal, через который
# victoriametrics скрейпит node-exporter из bridge-сети. Наружу не смотрит.
observability_node_exporter_listen: "172.17.0.1:9100"
# v0.52 не договаривается с docker 29.x (API 1.55): фабрика docker
# регистрируется, но DockerVersion в логе пуст, и метрики приходят без
# лейблов name и image — контейнер по ним не опознать.
# ghcr, а не gcr: свежие сборки публикуются только туда, в gcr.io
# последняя — v0.52.x, и запрос v0.60.5 там отдаёт not found.
observability_cadvisor_image: ghcr.io/google/cadvisor:v0.60.5

observability_domain: ""
observability_edge_network: "{{ edge_network | default('edge') }}"

observability_grafana_admin_password: ""

# Квартал: 332 МБ за 30 дней, то есть около гигабайта за 90 при 18 ГБ
# свободных. Столько же держатся логи — чтобы инцидент и график, по которому
# его нашли, кончались не в разное время.
observability_metrics_retention: 90d
# Логи дешевле метрик: неделя логов всей панели весит 31 МБ против 332 МБ
# метрик за 30 дней. Квартал — тот же горизонт, что у метрик: инцидент
# смотрится рядом с графиком, по которому его нашли, а не «логи кончились
# раньше». 90 дней ≈ 1 ГБ сейчас и ≈ 2.4 ГБ, если поднять xray до info.
observability_logs_retention: 2160h

# Узлы, где крутится node-exporter, кроме локального.
# [{address: "10.0.0.2:9100", instance: "miv-chi-01"}]
observability_remote_targets: []

# Приём метрик с нод по push-модели. Наружу открывается единственный путь
# /api/v1/write под basic auth: victoriametrics не проверяет авторизацию
# сама, и открытый порт отдал бы вместе с записью ещё чтение и
# /api/v1/admin/tsdb/delete_series.
observability_remote_write_enabled: false
observability_vm_domain: ""
observability_remote_write_user: metrics-push
# Пароль отдаётся нодам, хеш — traefik. Хранятся оба: сгенерировать хеш из
# пароля на лету нельзя, password_hash даёт разный результат при каждом
# прогоне и роль перестаёт быть идемпотентной.
observability_remote_write_password: ""
observability_remote_write_htpasswd: ""

# Приём логов с нод тем же путём и той же учёткой, что и метрики: отдельный
# домен потребовал бы записи в DNS и второго сертификата ради одного
# push-эндпоинта, а traefik различает их по пути. Включается вместе с
# observability_remote_write_enabled.
observability_logs_push_enabled: false

# Доставка алертов. Без alertmanager vmalert слать их некуда: его notifier.url
# смотрел на саму victoriametrics, и правила срабатывали в пустоту. Реквизиты
# по умолчанию — те же, что у gatus: второй бот ради тех же уведомлений
# избыточен, а разводить их по разным чатам незачем.
observability_alerting_enabled: false
observability_telegram_token: "{{ gatus_telegram_token | default('') }}"
observability_telegram_chat_id: "{{ gatus_telegram_id | default('') }}"

# Скрейп панели Remnawave: /metrics закрыт basic auth.
observability_panel_metrics_enabled: false
# Те же учётные данные, что панель кладёт в METRICS_USER/METRICS_PASS: панель и
# observability живут на одном хосте, и второго секрета для них не заводится.
# Пока здесь стоял пустой дефолт, скрейп ходил без пароля и получал 401 — цель
# молча числилась down, а метрик панели не было вовсе.
observability_panel_metrics_user: "{{ panel_metrics_user | default('metrics') }}"
observability_panel_metrics_password: "{{ panel_metrics_password | default('') }}"

# Вход в Grafana через Pocket ID. Клиент заводится в UI Pocket ID,
# redirect URI: https://<observability_domain>/login/generic_oauth
observability_oidc_enabled: false

# Группа в Pocket ID, участники которой входят в Grafana администраторами.
# Остальные получают Viewer.
observability_oidc_admin_group: admins
observability_oidc_name: Pocket ID
observability_oidc_issuer: ""
observability_oidc_client_id: ""
observability_oidc_client_secret: ""
