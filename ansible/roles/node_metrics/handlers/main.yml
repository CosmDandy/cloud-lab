---
- name: Restart node metrics
  community.docker.docker_compose_v2:
    project_src: "{{ node_metrics_dir }}"
    state: restarted

# Именно reload: SIGHUP заставляет dockerd перечитать daemon.json, не трогая
# запущенные контейнеры. Restart перезапустил бы remnanode, то есть оборвал
# всех пользователей ноды ради настройки, которая и так применяется только
# к новым контейнерам.
- name: Reload docker
  ansible.builtin.systemd_service:
    name: docker
    state: reloaded

# Перезапуск подрезает журнал до нового потолка сразу, а не когда-нибудь при
# следующей ротации. Systemd-journald переживает рестарт без потери записей:
# клиенты пишут в сокет, который остаётся на месте.
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# Юниты сборщика правятся шаблоном; без перечитывания systemd продолжит
# работать по старой копии до следующей перезагрузки.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Программа и обёртка читаются при старте, на лету не перечитываются.
- name: Restart hy2 collector
  ansible.builtin.systemd_service:
    name: hy2-stats.service
    state: restarted
    daemon_reload: true
  # В check-режиме юнит на диск не попал, и systemd о нём не знает.
  when: not ansible_check_mode
