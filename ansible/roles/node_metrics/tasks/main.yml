---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - node_metrics_remote_write_url | length > 0
      - node_metrics_remote_write_password | length > 0
      - node_metrics_instance | length > 0
    fail_msg: >-
      Нужны node_metrics_remote_write_url, пароль из SOPS и instance.
      Без instance метрики трёх нод сольются в один ряд.

- name: Create stack directory
  ansible.builtin.file:
    path: "{{ node_metrics_dir }}"
    state: directory
    owner: "{{ node_metrics_owner }}"
    group: "{{ node_metrics_owner }}"
    mode: "0750"

# Отдельным файлом, а не аргументом командной строки: аргументы контейнера
# видны в ps и в docker inspect любому, кто имеет доступ к машине.
- name: Write remote write password
  ansible.builtin.copy:
    content: "{{ node_metrics_remote_write_password }}"
    dest: "{{ node_metrics_dir }}/remote-write-password"
    owner: "{{ node_metrics_owner }}"
    group: "{{ node_metrics_owner }}"
    mode: "0600"
  no_log: true
  notify: Restart node metrics

- name: Render scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ node_metrics_dir }}/scrape.yml"
    owner: "{{ node_metrics_owner }}"
    group: "{{ node_metrics_owner }}"
    mode: "0644"
  notify: Restart node metrics

- name: Configure log shipping and rotation
  ansible.builtin.import_tasks: logs.yaml
  tags: [logs]

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ node_metrics_dir }}/docker-compose.yaml"
    owner: "{{ node_metrics_owner }}"
    group: "{{ node_metrics_owner }}"
    mode: "0640"
  notify: Restart node metrics

- name: Deploy stack
  community.docker.docker_compose_v2:
    project_src: "{{ node_metrics_dir }}"
    state: present
    pull: missing
    remove_orphans: true

- name: Wait for node exporter
  ansible.builtin.wait_for:
    host: "{{ node_metrics_exporter_listen.split(':')[0] }}"
    port: "{{ node_metrics_exporter_listen.split(':')[1] }}"
    timeout: 60

# Проверяется доставка, а не запуск: vmagent поднимается и при неверном
# пароле, просто копит данные в буфере и молчит в логах на уровне info.
- name: Verify metrics are accepted by the receiver
  ansible.builtin.command:
    cmd: >-
      docker exec vmagent wget -qO- --timeout=10
      http://127.0.0.1:8429/metrics
  register: node_metrics_vmagent_self
  changed_when: false
  # Read-only проверка, поэтому выполняется и в check-режиме: иначе command
  # пропускается, register остаётся пустым, until крутит все попытки впустую
  # и валит dry-run на ровном месте.
  check_mode: false
  retries: 6
  delay: 10
  until: >-
    'vmagent_remotewrite_requests_total' in node_metrics_vmagent_self.stdout

# Здесь, в отличие от vmagent, проверяются найденные цели, а не доставка:
# контейнеры ноды молчат сутками (у xray loglevel warning), и счётчик
# отправленных строк остаётся нулевым, даже когда всё исправно. Нулевое
# число целей, наоборот, означает, что promtail не видит docker.sock.
# С хоста, а не docker exec: в образе promtail нет ни shell, ни wget —
# проверять живость изнутри нечем.
- name: Verify promtail discovered container targets
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_metrics_promtail_port }}/metrics"
    return_content: true
  register: node_metrics_promtail_self
  changed_when: false
  check_mode: false
  retries: 6
  delay: 10
  # docker_sd не заполняет promtail_targets_active_total — она про file-based
  # цели и на ноде всегда ноль. Счётчик прочитанного с docker-целей растёт
  # только когда promtail действительно добрался до docker.sock и читает.
  until: >-
    node_metrics_promtail_self.content | default('')
    is search('promtail_docker_target_entries_total [1-9]')
  when: node_metrics_logs_enabled
  tags: [logs]
