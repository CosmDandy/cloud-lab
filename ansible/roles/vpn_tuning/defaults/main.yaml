---
# Sysctl-параметры для VPN-нод (RemnaWave + Xray).
# Значения — из docs/dpi/report-2026-06-22.md (Phase 1).
# Override через group_vars/host_vars при необходимости.

vpn_tuning_sysctl_file: /etc/sysctl.d/99-vpn-tuning.conf

vpn_tuning_sysctl:
  # TCP congestion + qdisc
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr

  # Network buffers (рассчитано под BDP 100 Мбит × 200 мс)
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  # 4 МБ, а не 1: xray не ставит SO_RCVBUF сам, поэтому размер приёмного
  # буфера каждого UDP-сокета задаётся отсюда. На 1 МБ ноды теряли QUIC
  # пачками — 25 849 UdpRcvbufErrors за час вечернего пика на hhh-sto-01
  # 08.09.2026, при recvq=0 и загрузке ядра 13 %. Дропы приходят микро-
  # всплесками: одна rx-очередь virtio на одном vCPU, и пока Go-рантайм не
  # пришёл читать сокет, мегабайт кончается за полсекунды.
  net.core.rmem_default: "4194304"
  net.core.wmem_default: "1048576"
  net.ipv4.tcp_rmem: "4096 262144 67108864"
  net.ipv4.tcp_wmem: "4096 262144 67108864"

  # TCP performance
  net.ipv4.tcp_window_scaling: "1"
  net.ipv4.tcp_slow_start_after_idle: "0"
  net.ipv4.tcp_notsent_lowat: "131072"
  net.ipv4.tcp_fastopen: "3"
  # Чёрные дыры PMTU: у HostHatch на ams и osl MTU интерфейса 1450, и если по
  # пути гасят ICMP «Fragmentation needed», соединение с большим MSS зависает
  # молча. С probing ядро само нащупает рабочий размер.
  net.ipv4.tcp_mtu_probing: "1"

  # Concurrency / backlog
  net.core.somaxconn: "65535"
  net.ipv4.tcp_max_syn_backlog: "65535"
  net.core.netdev_max_backlog: "32768"
  # Нижняя граница выше всех портов ноды (22, 2054, 2084, 2222, 2444, 2446):
  # с диапазона от 1024 исходящее соединение может занять порт инбаунда, и
  # после перезапуска xray не сможет забиндиться.
  net.ipv4.ip_local_port_range: "10240 65535"
  net.ipv4.tcp_fin_timeout: "15"
  net.ipv4.tcp_tw_reuse: "1"

  # Conntrack — высокий лимит соединений на прокси
  net.netfilter.nf_conntrack_max: "131072"
  net.netfilter.nf_conntrack_udp_timeout: "60"
  net.netfilter.nf_conntrack_udp_timeout_stream: "180"

  # Auto-reboot on kernel panic
  kernel.panic: "10"
  kernel.panic_on_oops: "1"

  # File descriptors (system-wide)
  fs.file-max: "2097152"

# Пер-юзер file descriptor limit
vpn_tuning_nofile_limit: 1048576

# Файл systemd-overrides
vpn_tuning_systemd_conf: /etc/systemd/system.conf

# Юнит, переживающий перезагрузку: net.core.default_qdisc действует только на
# интерфейсы, поднятые после его применения, а systemd-networkd поднимает eth0
# раньше, чем systemd-sysctl читает /etc/sysctl.d. Без юнита корневой qdisc
# после каждого ребута молча возвращается к pfifo_fast.
vpn_tuning_qdisc_unit: vpn-tuning-qdisc.service

# Интерфейс, к которому применяется корневой qdisc, и путь к tc для юнита:
# systemd не ищет бинарь в PATH, ExecStart требует абсолютного пути.
vpn_tuning_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"
vpn_tuning_tc_path: /usr/sbin/tc
