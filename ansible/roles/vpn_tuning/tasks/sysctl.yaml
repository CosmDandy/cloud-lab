---
- name: Load tcp_bbr kernel module
  community.general.modprobe:
    name: tcp_bbr
    state: present

- name: Persist tcp_bbr in modules-load.d
  ansible.builtin.copy:
    dest: /etc/modules-load.d/bbr.conf
    content: "tcp_bbr\n"
    owner: root
    group: root
    mode: "0644"

# Без этого пять conntrack-строк из 99-vpn-tuning.conf не применяются НА
# ЗАГРУЗКЕ: systemd-sysctl идёт после systemd-modules-load, но nf_conntrack на
# чистой загрузке не грузит никто — его подтягивает docker уже потом. На живой
# машине незаметно, потому что модуль давно в памяти. Вместе с kernel.panic=10
# это значит, что после каждой тихой автоперезагрузки conntrack-тюнинг молча
# возвращался бы к дефолтам.
- name: Persist nf_conntrack in modules-load.d
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nf-conntrack.conf
    content: "nf_conntrack\n"
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ vpn_tuning_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ vpn_tuning_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# net.core.default_qdisc действует только на интерфейсы, поднятые после его
# установки. На загрузке systemd-networkd поднимает интерфейс раньше, чем
# systemd-sysctl читает /etc/sysctl.d, поэтому одним sysctl обойтись нельзя ни
# на живой машине, ни после ребута: на боевых нодах eth0 месяц простоял на
# pfifo_fast при выставленном fq, и BBR работал без pacing. Юнит закрывает
# загрузку, задача ниже — текущее состояние.
- name: Ensure tc binary exists at the path baked into the unit
  ansible.builtin.stat:
    path: "{{ vpn_tuning_tc_path }}"
  register: vpn_tuning_tc_stat

- name: Fail early when tc is missing
  ansible.builtin.assert:
    that: vpn_tuning_tc_stat.stat.exists
    fail_msg: >-
      {{ vpn_tuning_tc_path }} not found — установите iproute2 или переопределите
      vpn_tuning_tc_path, иначе {{ vpn_tuning_qdisc_unit }} упадёт на загрузке.

- name: Install qdisc unit that survives reboot
  ansible.builtin.template:
    src: vpn-tuning-qdisc.service.j2
    dest: "/etc/systemd/system/{{ vpn_tuning_qdisc_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart qdisc unit

- name: Enable qdisc unit
  ansible.builtin.systemd_service:
    name: "{{ vpn_tuning_qdisc_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  # В check-режиме предыдущая задача файл не пишет, и systemd про юнит ещё не
  # знает — без этого dry-run падает на не существующем юните.
  when: not ansible_check_mode

- name: Read current root qdisc
  ansible.builtin.command:
    cmd: tc qdisc show dev {{ vpn_tuning_iface }}
  register: vpn_tuning_qdisc
  changed_when: false
  # Без этого в --check задача пропускается, register остаётся пустым, и
  # следующая падает на обращении к .stdout.
  check_mode: false

# Юнит с RemainAfterExit=yes второй раз не выполнится, а qdisc на живой машине
# может быть чужим — правим явно.
- name: Apply default qdisc to the already-up interface
  ansible.builtin.command:
    cmd: >-
      {{ vpn_tuning_tc_path }} qdisc replace dev {{ vpn_tuning_iface }}
      root {{ vpn_tuning_sysctl['net.core.default_qdisc'] }}
  when: >-
    vpn_tuning_sysctl['net.core.default_qdisc'] not in vpn_tuning_qdisc.stdout
  changed_when: true
