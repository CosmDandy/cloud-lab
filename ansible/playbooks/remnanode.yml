---
- name: Deploy Remnawave node
  hosts: vpn_nodes
  become: true
  # По одной ноде за раз. Пересоздание контейнера рвёт все инбаунды на
  # машине, и одновременный прогон по группе оставил бы пользователей без
  # выхода целиком, а не по трети.
  #
  # Порядок внутри группы — из inventory (ams, osl, sto), и он неверный:
  # через osl ходит рабочая машина, его надо трогать последним. Поэтому
  # прогон идёт с явным --limit, по одной ноде:
  #   --limit hhh-sto-01   затем hhh-ams-01   затем hhh-osl-01
  serial: 1

  roles:
    - role: remnanode
      tags: [remnanode]
