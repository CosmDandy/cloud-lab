---
# Метрики уходят push-моделью на control-plane. Наружу на нодах при этом не
# открывается ничего: соединение инициирует vmagent.
node_metrics_remote_write_url: https://vm.cosmdandy.dev/api/v1/write

# Логи уходят туда же и той же учёткой: домен один, traefik различает приём
# метрик и приём логов по пути. Отдельный домен потребовал бы записи в DNS и
# второго сертификата ради одного эндпоинта.
node_metrics_logs_enabled: true
node_metrics_loki_url: https://vm.cosmdandy.dev/loki/api/v1/push

# --- Файрвол ----------------------------------------------------------------
# Порты сверены с инбаундами конфиг-профиля панели (uuid
# 2cb12440-8073-45aa-bd46-25cefbc6c46d), а не только со слушателями ноды:
# 443, 2054 (Vision), 2084 (gRPC), 2444 и 2446 (XHTTP) — tcp; 47821-47824 —
# Hysteria2, плюс диапазон 47000-47100, который nft-таблица hyhop
# заворачивает на 47824.
firewall_tcp_ports:
  - 22
  - 443
  - 2054
  - 2084
  - 2444
  - 2446
firewall_udp_ports:
  - 47000-47100
  - 47821-47824

# 2222 — управляющий порт remnanode. Направление всегда панель → нода, и
# больше он не нужен никому: до сих пор он был открыт всему интернету.
firewall_restricted:
  - port: 2222
    sources:
      - 167.104.104.209

  # Приёмник боевого стенда (testbed/bench/prod-matrix.sh). Слушателя тут
  # нет — его поднимает сам прогон и гасит за собой; правило без слушателя
  # отвечает RST и ничего не открывает.
  #
  # Приёмник стоит на самой ноде, а не на отдельной машине, намеренно: тогда
  # и прямой замер, и замер через туннель идут одним и тем же путём офис↔нода
  # и сравнимы между собой. Трафик, который нода шлёт на собственный
  # публичный адрес, ядро заворачивает локально и наружу не выпускает, так
  # что внешний канал занимает только туннель — то, что и меряем.
  # Офисных адресов два, и это не избыточность: роутер балансирует исходящий
  # трафик между двумя каналами, выбирая канал по назначению. 11.09.2026
  # замер до Осло молча не проходил, пока tcpdump на ноде не показал, что
  # SYN приходит со второго адреса, которого в списке не было.
  - port: 18080
    sources:
      - 195.112.112.38   # офис, канал 1 — прямой замер, знаменатель
      - 185.34.155.174   # офис, канал 2
      - 167.104.104.131  # hhh-sto-01: трафик, пришедший через её же туннель
      - 85.155.190.66    # hhh-ams-01
