---
# Машины за пределами дома. Terraform ни одну из них не создаёт: в
# terraform/live/hhh-sto-02/ описан только DNS, а провайдера у HostHatch нет.
#
# Что раскатывается на машину, задаёт её host_services — список ролей из
# playbooks/site.yml. Группы ниже отвечают только за связность: под каким
# пользователем ходить и чья это машина.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=publickey"

  children:
    # Боевые ноды Remnawave. Контейнер remnanode развёрнут вне репозитория —
    # роли для него нет, Ansible отвечает только за тюнинг ядра
    # (playbooks/vpn-node-tune.yml). Адреса и страны сверены с панелью
    # 03.08.2026; машины Mivocloud (miv-chi-01, miv-ldn-01) убраны — их нет
    # ни в панели, ни в жизни.
    #
    # host_services не заданы: ноды разворачиваются отдельным плейбуком, а не
    # site.yml.
    vpn_nodes:
      vars:
        ansible_user: root
      hosts:
        # Коды стран в кавычках не для красоты: NO без них YAML читает как
        # булево false, и Осло получает country_code: False.
        hhh-ams-01:
          ansible_host: 85.155.190.66
          country_code: "NL"
        hhh-osl-01:
          ansible_host: 91.190.155.237
          country_code: "NO"
        hhh-sto-01:
          ansible_host: 167.104.104.131
          country_code: "SE"
          # Здесь же стоял derper, снят вместе с замером 2026-07-28, а 29.07
          # удалена и запись derp-sto.cosmdandy.dev. Поднимать роль на
          # нерезолвящемся имени нельзя — derper берёт сертификат через
          # TLS-ALPN-01, и letsencrypt откажет.
          #
          # Чтобы вернуть: завести запись на этот адрес, добавить
          # host_services: [derper] и раскомментировать mesh_derp_regions в
          # host_vars control-plane. Ровно одна роль: base трогает sshd на
          # живой машине, а docker тут стоит и настроен не нами.
          derper_hostname: derp-sto.cosmdandy.dev

    # Control plane: headscale, headplane, traefik, OIDC, панель, наблюдаемость.
    # Адреса статические намеренно — динамический inventory-плагин вернул бы
    # привязку к провайдеру в слой, который от неё освобождается.
    control:
      vars:
        ansible_user: root
      hosts:
        # Боевой control-plane. HostHatch Стокгольм, NVMe 8 GB: 2 ядра
        # EPYC 7763, 7936 МБ, 31 ГБ диска. Терраформ машину не создаёт —
        # у HostHatch нет провайдера; в terraform/live/hhh-sto-02/ только
        # DNS. Домены и секреты — в host_vars/hhh-sto-02/, те же самые, что
        # были у стенда: имена боевые с самого начала, поэтому переносятся
        # как есть.
        #
        hhh-sto-02:
          ansible_host: 167.104.104.209
          host_services:
            - base
            - docker
            - vpn_tuning
            - edge
            - mesh
            - oidc
            - panel
            - observability
            - gatus
            - gatus_public

        # Стенд. Своё дело сделал: все роли обкатаны, три прохода runbook
        # пройдены, повтор давал changed=0. Машина остаётся поднятой как
        # запасной аэродром на время переезда, но ролями больше не
        # управляется — host_services пуст намеренно.
        #
        # Иначе прогон без --limit раскатывал бы стенд и hhh-sto-02
        # одновременно, и обе машины дрались бы за одни и те же имена в
        # ACME и за одних и тех же OIDC-клиентов.
        htz-hel-test:
          ansible_host: 62.238.52.58
          host_services: []

        # Боевая машина. host_services пуст намеренно: она до сих пор
        # развёрнута схемой из docker-compose и ручных workflow (снесены
        # вместе со stacks/control и stacks/monitoring, когда переезд на
        # роли подтвердится), и её содержимое разъехалось с git. Прогон
        # site.yml по ней сейчас откатил бы прод назад, поэтому она в
        # раскатку не входит вовсе.
        htz-hel-01:
          ansible_host: 204.168.216.193

    # Релей в России. Состояния не держит: снести и поднять заново — норма.
    relay:
      vars:
        ansible_user: github-runner
      hosts:
        vds-mesh-mos-01:
          ansible_host: 83.220.174.55
          derper_hostname: derp.cosmdandy.ru
          host_services: [base, docker, derper]
