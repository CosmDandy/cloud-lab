---
# VPN nodes (managed manually via Mivocloud and similar providers).
# Terraform держит две машины: боевой htz-hel-01 (terraform/main.tf) и стенд
# htz-hel-test (terraform/live/htz-hel-test/).
#
# Что раскатывается на машину, задаёт её host_services — список ролей из
# playbooks/site.yml. Группы ниже отвечают только за связность: под каким
# пользователем ходить и чья это машина.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=publickey"

  children:
    vpn_nodes:
      vars:
        ansible_user: root
      # host_services не заданы: ноды разворачиваются отдельными плейбуками
      # (vpn-node-tune.yml), а не site.yml.
      hosts:
        miv-chi-01:
          ansible_host: 94.158.245.24
          country_code: MD
        miv-ldn-01:
          ansible_host: 194.180.158.12
          country_code: GB

    # Control plane: headscale, headplane, traefik, OIDC, панель, наблюдаемость.
    # Адреса статические намеренно — динамический inventory-плагин вернул бы
    # привязку к провайдеру в слой, который от неё освобождается.
    control:
      vars:
        ansible_user: root
      hosts:
        # Стенд. Домены и секреты — в host_vars/htz-hel-test/.
        # Панели здесь нет: Remnawave переезжает отдельно и последним,
        # дампом постгреса, чтобы пользователи VPN не заметили.
        htz-hel-test:
          ansible_host: 62.238.52.58
          host_services:
            - base
            - docker
            - vpn_tuning
            - edge
            - mesh
            - oidc
            - observability
            - gatus

        # Боевая машина. host_services пуст намеренно: она до сих пор
        # развёрнута схемой из docker-compose и ручных workflow (снесены
        # вместе со stacks/control и stacks/monitoring, когда переезд на
        # роли подтвердится), и её содержимое разъехалось с git. Прогон
        # site.yml по ней сейчас откатил бы прод назад, поэтому она в
        # раскатку не входит вовсе.
        htz-hel-01:
          ansible_host: 204.168.216.193

    # Релей в России. Состояния не держит: снести и поднять заново — норма.
    relay:
      vars:
        ansible_user: github-runner
      hosts:
        vds-mesh-mos-01:
          ansible_host: 83.220.174.55
          derper_hostname: derp.cosmdandy.ru
          host_services: [base, docker, derper]

    # Релеи на чужих машинах: узел уже занят посторонней нагрузкой и
    # управляется не только нами.
    relay_external:
      vars:
        ansible_user: root
      hosts:
        # host_services пуст: релей снят вместе с замером 2026-07-28, а
        # 29.07 удалена и запись derp-sto.cosmdandy.dev. Поднимать роль
        # сейчас нельзя — derper берёт сертификат через TLS-ALPN-01, и на
        # нерезолвящемся имени letsencrypt откажет.
        #
        # Чтобы вернуть: завести запись на 167.104.104.131, вернуть
        # host_services: [derper] и раскомментировать mesh_derp_regions в
        # host_vars стенда. Ровно одна роль: base трогает sshd на живом
        # чужом сервере, а docker там уже стоит и настроен не нами.
        hhh-sto-01:
          ansible_host: 167.104.104.131
          derper_hostname: derp-sto.cosmdandy.dev
          host_services: []
