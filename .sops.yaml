# Правила шифрования. sops применяет первое подходящее по path_regex,
# поэтому порядок значим.
#
# Шифруются только значения — имена переменных остаются читаемыми, и
# `git diff` показывает, какое поле изменилось, не раскрывая содержимого.
#
# Добавить получателя к уже зашифрованным файлам:
#   sops updatekeys ansible/inventory/host_vars/*/secrets.sops.yaml
# Отредактировать секрет:
#   sops ansible/inventory/host_vars/htz-hel-test/secrets.sops.yaml

# Имена ниже — обычные YAML-якоря, видны только в этом файле: в
# зашифрованные файлы попадает сам публичный ключ, а не его название.
# Переименование ничего не ломает и не требует перешифрования.
keys:
  # Основной ключ.
  - &main age1r7w9d59dtx5ksqxfujskjk5xwrt4ftv5czva2zzff2paggggy9nq4q0lxm
  # Ключ этого девконтейнера.
  - &devcontainer age15senurg48rul7qhfq7s58grxd84ku4rgpx3qjvegn9hvdh7s84fq5d5qag
  # Ключ CI. Отдельный намеренно: при утечке он отзывается удалением отсюда и
  # прогоном `sops updatekeys`, а личный ключ и ключ девконтейнера при этом не
  # трогаются. Приватная часть лежит файлом на своём раннере, а не секретом в
  # GitHub — раннер наш, значит GitHub может ключ не держать вовсе.
  #
  # Отзыв не защищает уже закоммиченное: история git хранит старый шифротекст,
  # и утёкший ключ расшифрует прошлые версии файлов. Поэтому ротация ключа
  # обязана сопровождаться сменой самих значений.
  - &ci age1grp3kmtu48stpw82xwnugpppv5ej4gtqpra6fprt0lt9gqmfdc0qy0pmm5

creation_rules:
  # Все ключи — равноправные получатели: файл расшифровывается любым из них,
  # потеря одного не запирает секреты.
  - path_regex: ansible/inventory/(host_vars|group_vars)/.*/secrets\.sops\.ya?ml$
    key_groups:
      - age:
          - *main
          - *devcontainer
          - *ci
