# Terraform for every stack under terraform/live/<stack>. Each stack is its own
# HCP Terraform workspace (remote execution), so the stack list is discovered
# from the tree instead of maintained here — a new directory gets CI by existing.
#
# PR:        validate (no credentials) → speculative plan, posted to the PR.
# master:    validate → saved plan → apply of exactly that plan, only when it has
#            changes and only after approval on the `terraform` environment.
# dispatch:  same as master when run on master; a plan only on any other ref.
name: terraform

on:
  pull_request:
    paths:
      - terraform/**
      - .terraformignore
      - .github/workflows/terraform.yml
      - .github/workflows/terraform-stack.yml
  push:
    branches: [master]
    paths:
      - terraform/**
      - .terraformignore
      - .github/workflows/terraform.yml
      - .github/workflows/terraform-stack.yml
  workflow_dispatch:

permissions: {}

# Two master runs must not interleave their saved plans and applies; superseded
# PR runs are simply dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stacks:
    name: stacks + fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      # Recursive from the root: covers live stacks and the shared modules.
      - name: fmt
        run: terraform fmt -check -recursive -diff terraform
      - name: list
        id: list
        run: |
          list=$(find terraform/live -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rcs 'split("\n")[:-1]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "stacks: $list"

  stack:
    name: ${{ matrix.stack }}
    needs: stacks
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.list) }}
    # NOTE: zizmor (low) suggests the `$/` self-repository form; actionlint
    # 1.7.12 rejects it. Switch once actionlint accepts it.
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: ${{ matrix.stack }}
    permissions:
      contents: read
      pull-requests: write
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
