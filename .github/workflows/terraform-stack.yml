# One Terraform stack: validate → plan → apply. Called by terraform.yml once per
# directory under terraform/live/. Kept as a reusable workflow so that plan and
# apply are a real job pair per stack: apply reads the plan job's outputs, and
# the environment approval is requested only for a stack that has changes.
#
# Runs execute remotely in HCP Terraform; variables (cloudflare_api_token) live
# in the workspace's variable set there, so no TF_VAR_* is passed from GitHub.
# The only credential here is the HCP token, and only plan and apply see it.
name: terraform-stack

on:
  workflow_call:
    inputs:
      stack:
        description: Directory name under terraform/live/
        type: string
        required: true
    secrets:
      # Not required: on Dependabot and fork PRs it is empty, and only the
      # validate job runs there.
      TF_API_TOKEN:
        required: false

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/live/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the workspace's version: remote runs use that version anyway,
      # and a newer local CLI can refuse to operate on the workspace.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      # No backend, no credentials: this part runs for fork PRs too.
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  plan:
    name: plan
    needs: validate
    # Fork PRs and Dependabot PRs get no Actions secrets, so a plan there could
    # only fail; validate has already checked them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the plan comment on the PR
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      STACK: ${{ inputs.stack }}
      # A saved plan is created only where it may be applied. Elsewhere the
      # plan stays speculative and leaves nothing applicable behind in HCP.
      SAVE: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: terraform/live/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform init -input=false -no-color

      # -detailed-exitcode: 0 no changes, 1 error, 2 changes. The step itself
      # never fails, so the PR comment below is written for errors too; the
      # last step turns an error back into a red job.
      - name: plan
        id: plan
        run: |
          set +e
          args=(-input=false -no-color -detailed-exitcode)
          [ "$SAVE" = true ] && args+=(-out=tfplan)
          terraform plan "${args[@]}" 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ]; then echo "changes=true"; else echo "changes=false"; fi >> "$GITHUB_OUTPUT"
          {
            echo "### \`$STACK\` — plan exit $code"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per stack, edited in place on every push instead of a new
      # comment per run. The plan is read from the file, never interpolated
      # into the script: plan text is data that must not become code.
      - name: comment
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const code = process.env.PLAN_EXITCODE;
            const marker = `<!-- terraform-plan:${stack} -->`;
            const limit = 60000;
            let plan = fs.readFileSync(`terraform/live/${stack}/plan.txt`, 'utf8');
            if (plan.length > limit) {
              plan = '… (head truncated, full plan in the run log)\n' + plan.slice(-limit);
            }
            const status = { '0': 'no changes', '2': 'has changes' }[code] ?? `failed, exit ${code}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `#### Terraform plan · \`${stack}\` · ${status}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `[Run](${run})`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The saved plan file is a pointer to the HCP run (run id + hostname), so
      # the artifact carries no plan content and no secrets.
      - name: keep saved plan
        if: steps.plan.outputs.changes == 'true' && env.SAVE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.stack }}
          path: terraform/live/${{ inputs.stack }}/tfplan
          # As long as an environment approval may wait (30 days); a shorter
          # retention turns a late approval into "artifact not found".
          retention-days: 30
          if-no-files-found: error

      - name: plan status
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          echo "terraform plan failed with exit $PLAN_EXITCODE" >&2
          exit 1

  apply:
    name: apply
    needs: plan
    if: >-
      needs.plan.outputs.changes == 'true' &&
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Required reviewers on this environment are the gate between the plan in
    # the run summary and the change in production.
    environment: terraform
    concurrency:
      group: terraform-apply-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    defaults:
      run:
        working-directory: terraform/live/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform init -input=false -no-color
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.stack }}
          path: terraform/live/${{ inputs.stack }}
      # Applies exactly the reviewed plan. If anything changed state in between,
      # HCP rejects the stale plan instead of applying something unreviewed.
      - run: terraform apply -input=false -no-color tfplan
