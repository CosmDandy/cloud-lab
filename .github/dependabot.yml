# Пины по SHA не обновляются сами — этим занимается Dependabot: он поднимает PR
# с новым SHA и правит комментарий-версию рядом.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Пауза перед обновлением: большинство supply-chain атак на пакеты и экшены
    # выявляют в первые дни, поэтому свежие релизы не тянем сразу.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Provider pins live in each stack's .terraform.lock.hcl; without this they
  # only move when someone runs `terraform init -upgrade` by hand.
  - package-ecosystem: terraform
    directories:
      - /terraform/live/*
      - /terraform/modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
